<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="orcha-token" content="__ORCHA_TOKEN__" />
<title>Orcha Settings</title>
<style>/*PICO*/</style>
<style>
  /* Pico styles the controls; orcha's theme colors are painted on top at runtime (paintTheme). */
  :root {
    --accent: #ff8fab; --text: #e8f0d6; --muted: #a0b28a; --raised: #222a1e;
    --mono: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
    --pico-font-family-sans-serif: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    --yellow: #f2c53d; --green: #96d660; --red: #e5484d;
    --edge: 0 0 0 1px rgba(255, 255, 255, .06), 0 1px 2px rgba(0, 0, 0, .25);
  }
  [data-theme=light] { --edge: 0 0 0 1px rgba(0, 0, 0, .07), 0 1px 2px rgba(0, 0, 0, .05); }
  /* :not(#_) outranks Pico's own theme selectors */
  :root:not(#_), [data-theme]:not(#_) {
    --pico-font-size: 15px; --pico-line-height: 1.45; --pico-border-radius: 8px;
    --pico-spacing: .8rem; --pico-form-element-spacing-vertical: .38rem; --pico-form-element-spacing-horizontal: .7rem;
    --pico-primary: var(--accent); --pico-primary-background: var(--accent); --pico-primary-border: var(--accent);
    --pico-primary-hover: var(--accent); --pico-primary-hover-background: color-mix(in srgb, var(--accent) 86%, black);
    --pico-primary-hover-border: color-mix(in srgb, var(--accent) 86%, black); --pico-primary-inverse: #121212;
    --pico-primary-focus: color-mix(in srgb, var(--accent) 35%, transparent); --pico-form-element-focus-color: var(--accent);
  }
  html, body { font-size: 15px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  h1, h2, h3 { text-wrap: balance; }
  p, small { text-wrap: pretty; }
  button, [role=button] { width: auto; transition-property: transform, background-color, color, border-color; transition-duration: .12s; }
  button:active:not(:disabled), [role=button]:active { transform: scale(.96); }
  input:not([type=checkbox], [type=radio], [type=range]), select { margin: 0; font-size: .93rem; }
  small, .muted { color: var(--muted); }
  output, .num { font-variant-numeric: tabular-nums; }

  /* header */
  .top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--pico-background-color) 90%, transparent);
    backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--pico-muted-border-color); }
  .top .bar { display: flex; align-items: center; gap: 1rem; max-width: 1080px; margin: 0 auto; padding: .6rem 1.25rem; }
  .brand { font: 700 1rem var(--mono); white-space: nowrap; }
  .brand span { background: var(--accent); color: #121212; border-radius: 5px; padding: .05rem .4rem; margin-left: .35rem; font-size: .75rem; }
  .search { flex: 1; max-width: 400px; margin: 0 auto; }
  .search input { border-radius: 99px; padding: .36rem 1rem; }
  .live { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .live b { color: var(--green); }
  .ghostbtn { background: transparent; border: 1px solid var(--pico-muted-border-color); color: var(--text); padding: .25rem .7rem; margin: 0; font-size: .85rem; }

  /* page: tabs that follow the scroll, one column of cards */
  .page { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 2rem; max-width: 1080px; margin: 0 auto; padding: 1.4rem 1.25rem 4rem; }
  .tabs { position: sticky; top: 4.4rem; align-self: start; display: flex; flex-direction: column; gap: 2px; }
  .tabs a { display: flex; align-items: center; justify-content: space-between; min-height: 36px; padding: 0 .75rem; border-radius: 8px;
    color: var(--muted); text-decoration: none; font-size: .92rem; transition-property: background-color, color; transition-duration: .12s; }
  .tabs a:hover { color: var(--text); background: var(--pico-card-background-color); }
  .tabs a.on { color: var(--text); background: var(--pico-card-background-color); box-shadow: inset 2px 0 0 var(--accent); font-weight: 600; }
  .tabs a i { font: normal 600 .68rem var(--mono); min-width: 1.25rem; padding: 0 .3rem; text-align: center; border-radius: 99px;
    background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .tabs a i.warn { background: color-mix(in srgb, var(--yellow) 22%, transparent); color: var(--yellow); }
  main > article { margin: 0 0 1.1rem; padding: 1.1rem 1.25rem .9rem; border-radius: 12px; border: 0; box-shadow: var(--edge); scroll-margin-top: 4.8rem; }
  .head { margin-bottom: .4rem; }
  .head h2 { font-size: 1.08rem; font-weight: 650; margin: 0 0 .1rem; }
  .head p { margin: 0; font-size: .86rem; color: var(--muted); }
  .sub { font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 1rem 0 .1rem; }

  /* a setting: what it is on the left, the control lined up on the right */
  .row { display: grid; grid-template-columns: minmax(170px, 1fr) auto; gap: .2rem 1.2rem; align-items: center;
    min-height: 52px; padding: .45rem 0; border-top: 1px solid var(--pico-muted-border-color); }
  .sub + .row, .rows > .row:first-child { border-top: 0; }
  .label b { font-weight: 560; font-size: .95rem; }
  .label small { display: block; font-size: .82rem; line-height: 1.35; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: .45rem; vertical-align: middle; }
  .ctl { display: flex; align-items: center; justify-content: flex-end; gap: .4rem; min-width: 0; }
  .ctl > .grow { flex: none; width: 270px; max-width: 100%; }
  .ctl > input.grow { width: 300px; }
  .reset { position: relative; background: none; border: 0; color: var(--muted); padding: 0 .25rem; margin: 0; font-size: 1rem; line-height: 1; }
  .reset::after { content: ""; position: absolute; inset: -12px -8px; }
  .reset:hover { color: var(--accent); }
  .warn { grid-column: 1 / -1; font-size: .82rem; color: var(--yellow); }
  input[role=switch] { margin: 0; }
  /* segmented control: one track, the chosen option a raised pill inside it */
  .seg { display: inline-flex; flex-wrap: nowrap; gap: 2px; margin: 0; width: auto; padding: 3px; border-radius: 10px;
    background: var(--raised); box-shadow: inset 0 0 0 1px var(--pico-muted-border-color); }
  .seg button, .seg button:not(.on) { font-size: .84rem; padding: .28rem .8rem; margin: 0; border: 0; border-radius: 7px;
    background: transparent; color: var(--muted); box-shadow: none; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--pico-card-background-color); color: var(--text); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 0 0 1px var(--pico-muted-border-color), inset 0 -2px 0 var(--accent); }
  .seg .btn.ghost { border-radius: 7px; }
  .range { display: flex; align-items: center; gap: .7rem; width: 300px; max-width: 100%; }
  .range input { margin: 0; flex: 1; }
  .range output { font: 600 .82rem var(--mono); min-width: 2.8rem; text-align: right; }
  .swatches { display: flex; gap: .45rem; flex-wrap: wrap; justify-content: flex-end; }
  .swatches button { position: relative; width: 1.5rem; height: 1.5rem; padding: 0; margin: 0; border-radius: 50%; border: 0; }
  .swatches button::after { content: ""; position: absolute; inset: -8px; }
  .swatches button.on { box-shadow: 0 0 0 2px var(--pico-card-background-color), 0 0 0 4px var(--text); }
  .swatches button.auto { background: conic-gradient(#ff8fab, #ffd23f, #96d660, #6c8cff, #b18cff, #ff8fab); }
  .strip { display: flex; height: 24px; width: 92px; flex: none; border-radius: 6px; overflow: hidden; box-shadow: var(--edge); }
  .strip i { flex: 1; }
  details.more > summary { font-size: .86rem; color: var(--muted); margin: .6rem 0 0; list-style: none; cursor: pointer; }
  details.more > summary::after { display: none; }
  details.more[open] > summary { margin-bottom: .3rem; }

  /* layout: a miniature orcha window beside its settings */
  .look { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 1.4rem; align-items: start; }
  .look .preview { position: sticky; top: 5.2rem; }
  .win { border-radius: 10px; overflow: hidden; height: 204px; display: flex; flex-direction: column;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .28); }
  .win .titlebar { height: 22px; flex: none; display: flex; align-items: center; gap: 5px; padding: 0 9px; }
  .win .titlebar i { width: 8px; height: 8px; border-radius: 50%; }
  .win .titlebar span { margin-left: auto; font: 600 8.5px var(--mono); padding: 1px 6px; border-radius: 4px; color: #121212; }
  .win .body { flex: 1; display: flex; min-height: 0; }
  .win .side, .win .panel { display: flex; flex-direction: column; gap: 5px; padding: 8px 7px; font: 600 7.5px var(--mono); letter-spacing: .04em; }
  .win .proj { display: flex; align-items: center; gap: 4px; font: 500 8px var(--pico-font-family-sans-serif); letter-spacing: 0; padding: 2px 4px; border-radius: 3px; }
  .win .proj b { width: 5px; height: 5px; border-radius: 50%; flex: none; }
  .win .panel { width: 27%; }
  .win .panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; }
  .win .pane { border-radius: 4px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .win .bar { height: 4px; border-radius: 2px; }
  .win .gauge { display: flex; align-items: center; gap: 4px; font: 500 7.5px var(--mono); letter-spacing: 0; }
  .win .gauge > div { flex: 1; height: 4px; border-radius: 2px; overflow: hidden; }
  .win .gauge > div > b { display: block; height: 100%; }
  .win .train { margin-top: auto; height: 7px; border-radius: 2px; }
  .win .status { height: 15px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; }
  .win .status .gauge { width: 70px; }
  .preview small { display: block; margin-top: .55rem; font-size: .8rem; }

  /* accounts */
  .acct { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) auto; gap: .3rem 1.2rem; align-items: center;
    min-height: 58px; padding: .5rem 0; border-top: 1px solid var(--pico-muted-border-color); }
  .acct:first-of-type { border-top: 0; }
  .acct .who b { font-weight: 600; font-size: .95rem; }
  .acct .who small { display: block; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct .tag { font: 600 .66rem var(--mono); margin-left: .4rem; padding: .05rem .45rem; border-radius: 99px; vertical-align: 1px;
    background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .acct .tag.dim { background: var(--raised); color: var(--muted); }
  .meters { display: grid; gap: .3rem; }
  .meter { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) 2.8rem; gap: .5rem; align-items: center; font-size: .78rem; color: var(--muted); }
  .meter > div { height: 6px; border-radius: 99px; background: var(--raised); overflow: hidden; }
  .meter > div > b { display: block; height: 100%; border-radius: 99px; }
  .meter span:last-child { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .acct .acts { display: flex; gap: .35rem; justify-content: flex-end; }
  .addrow { display: flex; gap: .5rem; align-items: center; margin-top: .5rem; }
  .addrow input { max-width: 220px; }

  /* when an account runs low: three steps in the order they happen */
  .stages { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: .5rem; align-items: stretch; margin: .5rem 0 .3rem; }
  .stage { display: flex; flex-direction: column; gap: .35rem; padding: .85rem .9rem; border-radius: 10px; background: var(--raised);
    box-shadow: inset 0 0 0 1px var(--pico-muted-border-color); }
  .stage.off { background: transparent; box-shadow: inset 0 0 0 1px var(--pico-muted-border-color); }
  .stage.off .big, .stage.off b { opacity: .45; }
  .stage .stage-head { display: flex; align-items: center; justify-content: space-between; min-height: 26px; }
  .stage .when { font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .stage .big { display: flex; align-items: center; gap: .35rem; font: 700 1.7rem var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
  .stage .big button { width: 30px; height: 30px; padding: 0; margin: 0; border-radius: 8px; font-size: 1rem; line-height: 1;
    background: var(--pico-card-background-color); color: var(--text); border: 0; box-shadow: inset 0 0 0 1px var(--pico-muted-border-color); }
  .stage .big span { min-width: 3.2rem; text-align: center; }
  .stage b { font-weight: 600; font-size: .95rem; }
  .stage small { font-size: .8rem; line-height: 1.35; }
  .stage .warn { font-size: .78rem; }
  .arrow { align-self: center; color: var(--muted); font-size: 1.1rem; }
  .twocol { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1.8rem; }
  .twocol .row { grid-template-columns: minmax(0, 1fr) auto; }
  .twocol .row:nth-child(-n+2) { border-top: 0; }

  /* projects */
  .pick { display: flex; align-items: center; gap: .7rem; margin: .6rem 0 .2rem; }
  .pick select { flex: 1; max-width: 420px; }
  .pick small { flex: 1; }
  .item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .2rem .85rem; align-items: center; min-height: 50px;
    padding: .35rem 0; border-top: 1px solid var(--pico-muted-border-color); }
  .sub + .item, .sub + small + .item { border-top: 0; }
  .item b { font-weight: 560; font-size: .93rem; }
  .item small { display: block; font-size: .8rem; }
  .item small a { color: var(--muted); }
  .item .text { position: relative; background: none; border: 0; color: var(--muted); padding: 0 .3rem; margin: 0; font-size: .8rem; }
  .item .text::after { content: ""; position: absolute; inset: -12px -6px; }
  .item pre { grid-column: 2 / -1; margin: .25rem 0 .2rem; padding: .55rem .7rem; font-size: .76rem; white-space: pre-wrap; border-radius: 6px; }
  .apply { position: sticky; bottom: 0; display: flex; align-items: center; gap: .6rem; padding: .7rem 0 .2rem; margin-top: .3rem;
    background: var(--pico-card-background-color); box-shadow: 0 -1px 0 var(--pico-muted-border-color); }
  .apply .grow { flex: 1; font-size: .86rem; color: var(--muted); }
  .btn { padding: .3rem .85rem; font-size: .85rem; margin: 0; }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--pico-form-element-border-color); }
  .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
  .diff { margin: .5rem 0 0; padding: .65rem; font-size: .75rem; line-height: 1.5; max-height: 280px; overflow: auto; white-space: pre-wrap; border-radius: 8px; }
  .diff .add { display: block; background: color-mix(in srgb, var(--green) 22%, transparent); }
  .diff .del { display: block; background: color-mix(in srgb, var(--red) 22%, transparent); }
  .chip { font: 600 .7rem var(--mono); border-radius: 99px; padding: .08rem .55rem; background: var(--raised); color: var(--muted); white-space: nowrap; }
  .chip.on, .chip.done { background: color-mix(in srgb, var(--green) 22%, transparent); color: var(--green); }
  .chip.working { background: color-mix(in srgb, var(--yellow) 22%, transparent); color: var(--yellow); }
  .chip.blocked { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }

  /* running now */
  .bgrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .7rem; align-items: center; min-height: 50px;
    padding: .3rem 0; border-top: 1px solid var(--pico-muted-border-color); }
  .bgrow:first-of-type { border-top: 0; }
  .bgrow b { font-weight: 560; font-size: .93rem; }
  .bgrow small { display: block; font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .counts { display: flex; gap: .4rem; flex-wrap: wrap; margin: .1rem 0 .3rem; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: .8rem;
    background: var(--text); color: var(--pico-background-color); border-radius: 10px; padding: .55rem .6rem .55rem 1rem; font-size: .88rem;
    max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, .3); animation: rise .18s cubic-bezier(.2, 0, 0, 1); }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }
  .toast.bad { background: var(--red); color: #fff; }
  .toast button { margin: 0; padding: .15rem .65rem; font-size: .8rem; background: transparent; color: inherit; border: 1px solid currentColor; }
  .empty, .gone { text-align: center; color: var(--muted); padding: 2.5rem 0; }


  /* orcha's own look: ink outlines, hard offset shadows, flat color, mono labels */
  :root { --ink: #0b0a09; }
  [data-theme=light] { --ink: #111111; }
  main > article { border-radius: 6px; border: 2.5px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
  .head h2 { font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; font-size: 1rem; }
  .sub { font-family: var(--mono); color: var(--text); }
  .seg { padding: 0; gap: 0; border-radius: 6px; background: var(--pico-card-background-color); box-shadow: 0 0 0 2px var(--ink), 2px 2px 0 2px var(--ink); }
  .seg button, .seg button:not(.on) { border-radius: 0; color: var(--text); font-family: var(--mono); font-size: .8rem; }
  .seg button + button { box-shadow: inset 2px 0 0 var(--ink); }
  .seg button.on { background: var(--accent); color: #111; box-shadow: none; }
  .seg button + button.on { box-shadow: inset 2px 0 0 var(--ink); }
  input[role=switch] { box-shadow: 0 0 0 2px var(--ink); }
  .btn, .ghostbtn { border: 2px solid var(--ink); border-radius: 5px; box-shadow: 2px 2px 0 var(--ink); font-family: var(--mono); }
  .btn:active, .ghostbtn:active { transform: translate(2px, 2px); box-shadow: none; }
  .tabs a { font-family: var(--mono); font-size: .85rem; }
  .tabs a.on { background: var(--yellow); color: #111; border-radius: 5px; box-shadow: 0 0 0 2px var(--ink), 3px 3px 0 2px var(--ink); }
  .chip { border: 1.5px solid var(--ink); }
  .summary, .strip, .win { box-shadow: 0 0 0 2px var(--ink), 3px 3px 0 2px var(--ink); border-radius: 5px; }
  .brand span { box-shadow: 0 0 0 2px var(--ink); }
  input:not([type=checkbox], [type=radio], [type=range]), select { border: 2px solid var(--ink); border-radius: 5px; }
  .toast { border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 6px; font-family: var(--mono); }

  .stage { border-radius: 6px; background: var(--pico-card-background-color); box-shadow: 0 0 0 2px var(--ink), 4px 4px 0 2px var(--ink); }
  .stage.off { box-shadow: 0 0 0 2px var(--ink); background: transparent; }
  .stage .when { font-family: var(--mono); color: var(--text); }
  .stage .big button { border-radius: 5px; box-shadow: 0 0 0 2px var(--ink), 2px 2px 0 2px var(--ink); }
  .stage .big button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 2px var(--ink); }
  .arrow { font: 700 1.3rem var(--mono); color: var(--text); }
  .meter > div { height: 10px; border-radius: 3px; box-shadow: 0 0 0 2px var(--ink); background: var(--pico-card-background-color); }
  .meter > div > b { border-radius: 0; }
  .meter span { font-family: var(--mono); }
  .acct .tag { border: 1.5px solid var(--ink); background: var(--yellow); color: #111; }
  .acct .tag.dim { background: var(--pico-card-background-color); color: var(--text); }
  .item pre, .diff { border: 2px solid var(--ink); border-radius: 5px; }
  .reset { font-weight: 700; color: var(--text); }
  .dot { border-radius: 0; width: 7px; height: 7px; box-shadow: 0 0 0 1.5px var(--ink); }
  .search input { border-radius: 6px; }
  .tabs a i { border: 1.5px solid var(--ink); background: var(--accent); color: #111; }
  .tabs a i.warn { background: var(--yellow); }
  @media (max-width: 820px) {
    .page { grid-template-columns: minmax(0, 1fr); gap: .6rem; padding: .8rem; }
    .tabs { top: 3.5rem; z-index: 5; flex-direction: row; overflow-x: auto; background: var(--pico-background-color); padding: .3rem 0; }
    .tabs a { white-space: nowrap; }
    .look, .twocol { grid-template-columns: minmax(0, 1fr); }
    .stages { grid-template-columns: minmax(0, 1fr); } .arrow { display: none; }
    .acct { grid-template-columns: minmax(0, 1fr); }
    .look .preview { position: static; }
    .row, .step { grid-template-columns: minmax(0, 1fr); }
    .ctl { justify-content: flex-start; }
    .search { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
